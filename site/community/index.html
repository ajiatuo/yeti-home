<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唤醒社区 · 串门村庄</title>
  <link rel="stylesheet" href="/static/community.css">
</head>
<body>
  <header class="cv-top">
    <div class="cv-title">🏡 唤醒社区 · 串门村庄</div>
    <div class="cv-right">
      <span id="cv-me">未登录</span>
      <a class="cv-back" href="/">← 回大门</a>
    </div>
  </header>

  <main class="cv-stage">
    <div class="cv-world" id="cv-world">
      <div class="cv-shade cv-shade-dusk"></div>
      <div class="cv-shade cv-shade-night"></div>
      <div id="cv-avatar"></div>
      <button id="cv-door" type="button" style="left:46.5%; top:62.5%;">
        <span class="cv-door-glow"></span>
        <span class="cv-door-name">样板间 · 阿暖与阿安的家</span>
      </button>
    </div>
  </main>

  <div class="cv-hint">
    <span>点一点地面，小人就走过去 · 点发光的门，进屋串门</span>
    <a class="cv-enter" href="/community/house.html">直接进样板间 →</a>
  </div>

  <script src="/static/community-village.js"></script>
</body>
</html>
